name: pipeline

on:
  schedule:
    # 09:12 UTC daily. Off the hour on purpose: scheduled jobs pile up at :00
    # and GitHub queues them, which turns a two minute run into a twenty
    # minute wait.
    - cron: "12 9 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract
        # Pull requests use sample data: a fork should not be able to trigger
        # a full extract against the city's API, and the schema is identical
        # either way so the models are tested just as hard.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m ingest.extract --sample 8000
          else
            python -m ingest.extract
          fi

      - name: Build and test
        run: |
          dbt build
          cp target/run_results.json target/run_results_warehouse.json

      - name: Train and score
        # On sample data, length of stay is random with respect to every
        # feature, so an honest model scores near chance. --expect-no-signal
        # fails the run if it does better than that, which would mean the
        # label is leaking into the inputs.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m ml.train --expect-no-signal
          else
            python -m ml.train
          fi

      - name: Test model outputs
        run: |
          dbt build --selector ml
          cp target/run_results.json target/run_results_ml.json

      - name: Generate docs
        if: github.event_name != 'pull_request'
        run: dbt docs generate --static

      - name: Assemble site
        # The write-up is the landing page, because a finding is what a reader
        # came for. The generated model documentation sits one level down for
        # anyone who wants to check how the numbers were built.
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/docs
          cp analysis/index.html _site/index.html
          cp target/static_index.html _site/docs/index.html

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Summarise run
        if: always()
        run: |
          {
            echo "### Pipeline run"
            echo ""
            if [ -f target/run_results_warehouse.json ]; then
              python - <<'PY'
          import json, collections, pathlib
          results = []
          for name in ("run_results_warehouse.json", "run_results_ml.json"):
              path = pathlib.Path("target") / name
              if path.exists():
                  results += json.loads(path.read_text())["results"]
          counts = collections.Counter(r["status"] for r in results)
          print(f"| Status | Count |")
          print(f"| --- | --- |")
          for status, n in sorted(counts.items()):
              print(f"| {status} | {n} |")
          failures = [r for r in results if r["status"] in ("error", "fail")]
          if failures:
              print("")
              print("**Failures**")
              for r in failures:
                  print(f"- `{r['unique_id']}`: {r.get('message', '')}")

          import duckdb
          try:
              con = duckdb.connect("shelter.duckdb", read_only=True)
              rows = con.execute("""
                  select model, n, base_rate, roc_auc, average_precision, top_decile_lift
                  from ml.model_evaluation order by model
              """).fetchall()
              flagged = con.execute(
                  "select count(*) from ml.monthly_performance where status = 'review'"
              ).fetchone()[0]
          except duckdb.Error:
              rows, flagged = [], None
          if rows:
              print("")
              print("### Long-stay model, holdout year")
              print("")
              print("| Model | Stays | Long-stay rate | AUC | Avg precision | Top 10% lift |")
              print("| --- | --- | --- | --- | --- | --- |")
              for m, n, base, auc, ap, lift in rows:
                  print(f"| {m} | {n:,} | {base:.1%} | {auc:.3f} | {ap:.3f} | {lift:.2f}x |")
              snr = con.execute("""
                  select roc_auc_excluding_snr, top_decile_precision_excluding_snr
                  from ml.model_evaluation
                  where model = 'gradient_boosting_recalibrated'
              """).fetchone()
              if snr and snr[0] is not None:
                  print("")
                  print(f"Excluding shelter-neuter-return transfers: AUC {snr[0]:.3f}, "
                        f"top 10% precision {snr[1]:.1%}")
              print("")
              print(f"Backtest months flagged for review: {flagged}")

              top = con.execute("""
                  select feature, auc_drop_mean from ml.feature_importance
                  order by rank limit 5
              """).fetchall()
              print("")
              print("**Top predictors** (AUC lost when shuffled)")
              print("")
              for feature, drop in top:
                  print(f"- {feature}: {drop:.3f}")

              months = con.execute("""
                  select strftime(intake_month, '%Y-%m'), n, base_rate, roc_auc,
                         calibration_gap, status, coalesce(drifted_features, '')
                  from ml.monthly_performance order by intake_month
              """).fetchall()
              print("")
              print("**Backtest by month**")
              print("")
              print("| Month | Stays | Long-stay rate | AUC | Calibration gap | Status | Drifted inputs |")
              print("| --- | --- | --- | --- | --- | --- | --- |")
              for m, n, base, auc, gap, status, drifted in months:
                  auc_text = f"{auc:.3f}" if auc is not None else "n/a"
                  print(f"| {m} | {n:,} | {base:.1%} | {auc_text} | {gap:+.3f} | {status} | {drifted} |")
          PY
            else
              echo "No run results produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-docs:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
